<text x="61" y="63" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#d0beff">FIVEM DEVELOPMENT</text>
<text x="39" y="175" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="900" letter-spacing="-3" fill="url(#accent)">TONECUSTOMS</text>
<text x="42" y="211" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" letter-spacing="3.2" fill="#f0e9ff">MORE THAN SCRIPTS. BUILT FOR ROLEPLAY.</text>
<text x="42" y="253" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.2" fill="#b9a8cf">CUSTOM SYSTEMS   •   COMMUNITY   •   CREATIVE DEVELOPMENT</text>
