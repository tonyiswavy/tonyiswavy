<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">ToneCustoms — FiveM Development</title>
<desc id="desc">Purple and black official ToneCustoms developer profile banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0915"/><stop offset=".53" stop-color="#16102b"/><stop offset="1" stop-color="#070610"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8450f6"/><stop offset=".6" stop-color="#d2a4ff"/><stop offset="1" stop-color="#7951ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#8138ee" stop-opacity=".44"/><stop offset="1" stop-color="#8138ee" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8252cf" stroke-opacity=".11" stroke-width=".8"/></pattern>
</defs>
<rect width="1200" height="320" rx="22" fill="url(#bg)"/>
